plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

// Dynamic Mod Versioning
def baseModVersion = "1.0"
def buildNum = project.hasProperty('buildNumber') ? project.property('buildNumber') : "0-dev"
def fullModVersion = "${baseModVersion}.${buildNum}"

version = "${property('minecraft_version')}-${fullModVersion}"
group = 'com.thedeucecara.digitalexchange'

base {
    archivesName = 'DigitalExchange'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = property('neo_version')

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${property('mod_id')}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // AE2 19.2.17 for NeoForge 1.21.1
    implementation "curse.maven:applied-energistics-2-223794:${property('ae2_curse_id')}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : fullModVersion,
            mod_author       : mod_author
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
