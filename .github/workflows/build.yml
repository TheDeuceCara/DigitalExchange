name: Build DigitalExchange

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Assets and Recipes
        run: |
          pip install pillow
          python scripts/generate_assets.py

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build with Gradle
        run: gradle build -PbuildNumber=${{ github.run_number }}

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: DigitalExchange-NeoForge-1.21.1
          path: build/libs/*.jar
